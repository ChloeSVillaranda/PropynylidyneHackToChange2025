services:
  frontend:
    build:
      context: ./frontend      
      dockerfile: Dockerfile
    ports:
      - "3000:80"               
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend        
      dockerfile: Dockerfile
    ports:
      - "4000:4000"              
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
