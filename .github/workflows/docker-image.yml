name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image for frontend
      run: |
          cd frontend
          docker build -t my-frontend .
    - name: Build the Docker image for backend
      run: |
          cd backend
          docker build -t backend .
